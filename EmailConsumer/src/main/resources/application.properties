spring.application.name=EmailConsumer

server.port = 8090

#SQL DB connection config
spring.datasource.url=jdbc:mysql://localhost:3307/notification_system
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#Kafka Consumer Configs
spring.kafka.consumer.group-id=email-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable.auto-commit=true
spring.kafka.consumer.auto-commit.interval=1000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.request.timeout.ms=30000
spring.kafka.consumer.properties.default.api.timeout.ms=60000
spring.kafka.properties.max.poll.records=600
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.session.timeout.ms=45000