spring.application.name=NotificationProcessorPriority1
server.port = 8081

#SQL DB connection config
spring.datasource.url=jdbc:mysql://localhost:3307/notification_system
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Enable application-level logging
logging.level.com.aryanbhagat.NotificationProcessorPriority1=DEBUG
logging.level.org.springframework.kafka=INFO

#Consumer config
spring.kafka.consumer.group-id=group-priority-1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.request.timeout.ms=30000
spring.kafka.consumer.properties.default.api.timeout.ms=60000

#Producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.properties.partitioner.class=com.aryanbhagat.NotificationProcessorPriority1.config.CustomPartitioner
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.session.timeout.ms=45000
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
